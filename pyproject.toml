[project]
name = "cyllex-argus"
version = "1.0.0"
description = "Cyllex Argus: AI-powered adversary intelligence"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Raul Redondo" }]
keywords = [
  "cti",
  "threat-intelligence",
  "adversary-intelligence",
  "mitre-attack",
  "stix",
  "purple-team",
  "security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.27",
  "pydantic>=2.13",
  "httpx>=0.28",
  "trafilatura>=2.2",
  "pdfplumber>=0.11.10",
  "rapidfuzz>=3.14",
  "feedparser>=6.0.14",
  "stix2>=3.0",
  "tomli-w>=1.0",
  "rich>=13",
  "fastapi>=0.142",
  "uvicorn>=0.54",
  "python-multipart>=0.0.32",
  "bcrypt>=4.2",
  "croniter>=2.0",
  "curl_cffi>=0.16",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Cyllex-Framework/Cyllex-Argus"
Repository = "https://github.com/Cyllex-Framework/Cyllex-Argus"
Issues = "https://github.com/Cyllex-Framework/Cyllex-Argus/issues"

[project.scripts]
argus = "cyllex_argus.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "fpdf2>=2.8",
    "httpx2>=2.0.0",
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyllex_argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Ruff is the project's lint + import-sort baseline, and CI runs `ruff check src tests` on every
# push and pull request — a lint failure breaks the build. Extending the rule set is therefore a
# decision to fix every existing violation of the new rule in the same commit.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/cyllex_argus/web/static"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear (likely-bugs), UP = pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is handled above; a long log string is not a bug.
# B008 is FastAPI's whole dependency-injection shape (`Depends()`, `Form()`, `File()`, `Query()` in defaults).
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# B011: pytest uses `assert`, bugbear complains about `assert False` in tests.
# E731: a one-line `now = lambda: date(2026, 1, 1)` stub reads better than a def in a test.
"tests/**" = ["B011", "E731"]

