name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Attach the built artifacts; --generate-notes fills the release body from the tag's commits.
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes || \
            gh release upload "$TAG" dist/* --clobber
